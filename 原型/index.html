  background-color: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.form-select:focus-visible {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-check {
  display: flex;
  min-height: 20px;
  align-items: center;
  gap: 6px;
}

.form-check-input {
  appearance: none;
  width: 14px;
  height: 14px;
  flex: 0 0 auto;
  margin: 0;
  border: 1px solid var(--input);
  color: var(--primary-foreground);
  background-color: transparent;
  cursor: var(--cursor-interaction, default);
  transition:
    background-color 150ms,
    border-color 150ms,
    box-shadow 150ms;
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;] {
  border-color: var(--input);
  border-radius: var(--radius-sm);
  corner-shape: var(--corner-shape);
  background-color: var(--secondary);
  box-shadow: var(--shadow-sm);
}

.form-check:not(.form-switch)
  .form-check-input:not(:disabled):not(:checked):hover {
  background-color: var(--card);
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;]:checked {
  border-color: var(--primary);
  background-color: var(--primary);
}

.form-check:not(.form-switch)
  .form-check-input[type=&quot;checkbox&quot;]:checked::before {
  display: block;
  width: 100%;
  height: 100%;
  background: var(--primary-foreground);
  content: &quot;&quot;;
  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);

  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);

}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
  [aria-pressed=&quot;true&quot;],
  [aria-selected=&quot;true&quot;],
  .is-selected
) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible,
.nav-link:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

@media (pointer: coarse) {

  .nav-link,
  .form-control,
  .form-select {
    min-width: 44px;
    min-height: 44px;
  }

  .form-control,
  .form-select {
    font-size: max(16px, var(--font-size-normal));
  }

  .form-control[type=&quot;file&quot;]::file-selector-button {
    min-width: 44px;
    min-height: 44px;
  }

  .form-control-color[type=&quot;color&quot;] {
    width: 44px;
    height: 44px;
  }

  .form-control:is(
    [type=&quot;date&quot;],
    [type=&quot;datetime-local&quot;],
    [type=&quot;month&quot;],
    [type=&quot;time&quot;],
    [type=&quot;week&quot;]
  ) {
    min-width: 0;
    max-width: 100%;
    padding-block: 8px;
  }

  .form-check {
    min-height: 44px;
    padding-inline: 15px;
  }

  .form-check-input {
    position: relative;
  }

  .form-check-input::after {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 44px;
    height: 44px;
    content: &quot;&quot;;
    transform: translate(-50%, -50%);
  }

  .form-check-label {
    display: inline-flex;
    min-width: 44px;
    min-height: 44px;
    align-items: center;
  }

  .form-range {
    height: 44px;
    touch-action: pan-y;
  }

  .form-range::-webkit-slider-runnable-track {
    height: 44px;
  }

  .form-range::-moz-range-track {
    height: 44px;
  }

  .form-range::-webkit-slider-thumb {
    margin-top: 12px;
  }
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

svg.lucide {

  width: var(--icon-size) !important;
  height: var(--icon-size) !important;
  flex: none;
  margin: 0 !important;
  stroke-width: 1.6;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

    function actionsFor(t){const list=[];if(terminal(t))return list;if(t.owner===user&amp;&amp;engineer()){if(t.state===&#x27;OPEN&#x27;)list.push([&#x27;开始处理&#x27;,&#x27;start&#x27;,true]);if(t.state===&#x27;PROCESSING&#x27;)list.push([&#x27;提交解决结果&#x27;,&#x27;solve&#x27;,true]);}

      &#x27;&lt;aside class=&quot;it-stack it-sideinfo&quot;&gt;&lt;section class=&quot;it-panel&quot;&gt;&lt;div class=&quot;it-section-head&quot;&gt;&lt;h2&gt;工单信息&lt;/h2&gt;&lt;/div&gt;&lt;dl class=&quot;it-props&quot;&gt;&lt;div&gt;&lt;dt&gt;当前负责人&lt;/dt&gt;&lt;dd&gt;&#x27;+(t.owner?people[t.owner].name+&#x27; · 工程师&#x27;:&#x27;尚未分配&#x27;)+&#x27;&lt;/dd&gt;&lt;/div&gt;&lt;div&gt;&lt;dt&gt;申请人&lt;/dt&gt;&lt;dd&gt;&#x27;+people[t.applicant].name+(people[t.applicant].disabled?&#x27;（已停用）&#x27;:&#x27;&#x27;)+&#x27;&lt;/dd&gt;&lt;/div&gt;&lt;div&gt;&lt;dt&gt;创建时间&lt;/dt&gt;&lt;dd&gt;&#x27;+t.created+&#x27;&lt;/dd&gt;&lt;/div&gt;&lt;div&gt;&lt;dt&gt;最近更新&lt;/dt&gt;&lt;dd&gt;&#x27;+t.updated+&#x27;&lt;/dd&gt;&lt;/div&gt;&lt;/dl&gt;&#x27;+(allowed.length?&#x27;&lt;hr class=&quot;it-rule&quot;&gt;&lt;h3&gt;当前操作&lt;/h3&gt;&lt;div class=&quot;it-actions&quot;&gt;&#x27;+allowed.map(([label,key,main])=&gt;button(label,key,main)).join(&#x27;&#x27;)+&#x27;&lt;/div&gt;&#x27;:&#x27;&#x27;)+(conclusion?&#x27;&lt;hr class=&quot;it-rule&quot;&gt;&lt;h3&gt;&#x27;+ (t.closure?&#x27;关闭记录&#x27;:&#x27;取消记录&#x27;)+&#x27;&lt;/h3&gt;&lt;dl class=&quot;it-props&quot; style=&quot;margin-top:12px&quot;&gt;&lt;div&gt;&lt;dt&gt;实际操作人 / 时间&lt;/dt&gt;&lt;dd&gt;&#x27;+people[conclusion.who].name+&#x27; / &#x27;+conclusion.time+&#x27;&lt;/dd&gt;&lt;/div&gt;&lt;div&gt;&lt;dt&gt;&#x27;+(t.closure?&#x27;关闭方式&#x27;:&#x27;取消类别&#x27;)+&#x27;&lt;/dt&gt;&lt;dd&gt;&#x27;+esc(conclusion.method||conclusion.category)+&#x27;&lt;/dd&gt;&lt;/div&gt;&#x27;+(conclusion.reason?&#x27;&lt;div&gt;&lt;dt&gt;原因&lt;/dt&gt;&lt;dd&gt;&#x27;+esc(conclusion.reason)+&#x27;&lt;/dd&gt;&lt;/div&gt;&#x27;:&#x27;&#x27;)+(conclusion.reference?&#x27;&lt;div&gt;&lt;dt&gt;保留工单编号&lt;/dt&gt;&lt;dd&gt;&#x27;+esc(conclusion.reference)+&#x27;&lt;/dd&gt;&lt;/div&gt;&#x27;:&#x27;&#x27;)+&#x27;&lt;/dl&gt;&#x27;:&#x27;&#x27;)+&#x27;&lt;/section&gt;&lt;section class=&quot;it-panel&quot;&gt;&lt;details open&gt;&lt;summary&gt;操作历史 &lt;small&gt;&#x     function renderAction(t){const labels={assign:t.owner?&#x27;转派工单&#x27;:&#x27;分配工程师&#x27;,solve:&#x27;提交解决结果&#x27;,return:&#x27;反馈未解决&#x27;,close:&#x27;确认关闭&#x27;,adminclose:&#x27;管理员代关&#x27;,cancel:&#x27;取消工单&#x27;,classify:&#x27;调整分类与优先级&#x27;};let fields=&#x27;&#x27;;
