    function reason(label,placeholder){return '<label><span>'+label+' <small>必填</small></span><textarea name="reason" required placeholder="'+placeholder+'"></textarea></label>';}
    function renderCreate(){return '<div class="it-heading"><div><div class="it-kicker">NEW REQUEST</div><h1>创建 IT 工单</h1><div class="it-sub">把问题说清楚，剩下的交给服务台。</div></div></div><div class="it-detail"><section class="it-panel"><form id="it-create" class="it-form"><label><span>问题标题 <small>必填 · 最多 100 字符</small></span><input name="title" placeholder="例如：VPN 无法连接，提示认证超时" required></label><label><span>问题分类 <small>必填</small></span><select name="type">'+options(types)+'</select></label><label><span>问题描述 <small>必填 · 最多 5000 字符</small></span><textarea name="description" style="min-height:170px" placeholder="遇到了什么问题？什么时候发生？已经尝试了哪些方法？" required></textarea></label><div><span>截图附件 <small>选填</small></span><div class="it-upload" style="margin-top:8px">'+icon('image-plus')+'<strong>选择截图 / 拖拽到此处</strong><small>PNG、JPG/JPEG · 最多 5 张 · 每张不超过 5 MB<br>本轮仅展示上传位置，不读取真实文件</small></div></div><div class="it-error" role="alert"></div><div class="it-form-actions">'+button('返回列表','back')+'<button class="it-button it-primary" type="submit">提交工单 '+icon('arrow-right')+'</button></div></form></section><aside class="it-panel"><h2>提交之后</h2><ol class="it-timeline"><li>管理员分配工程师</li><li>工程师处理与沟通</li><li>你验证结果并确认关闭</li></ol><hr class="it-rule"><dl class="it-props"><div><dt>申请人</dt><dd>'+actor().name+'</dd></div><div><dt>默认优先级</dt><dd>普通 · 管理员可调整</dd></div></dl><div class="it-sub" style="margin-top:20px">请勿填写账号密码等敏感信息。提交后原始描述保留，补充内容请通过回复发送。</div></aside></div>';}
    function renderAccounts(){return '<div class="it-heading"><div><div class="it-kicker">PEOPLE & ACCESS</div><h1>账号管理</h1><div class="it-sub">员工批量导入，工程师与管理员按需单个创建。</div></div>'+button(icon('user-plus')+' 单个新增','account-help')+'</div><div class="it-notice it-neutral">账号管理仅展示布局与示例反馈，新增、重置、停用及真实文件导入尚未实现。</div><section class="it-panel"><div class="it-section-head"><h2>企业账号</h2><small>'+Object.keys(people).length+' 个示例账号</small></div>'+Object.entries(people).map(([id,p])=>'<div class="it-account-row"><div class="it-user"><span class="it-avatar">'+p.name[0]+'</span><div>'+p.name+'<br><small>'+p.code+'</small></div></div><span>'+p.role+'</span><small>'+(p.disabled?'已停用':'正常')+'</small><button class="it-link" data-action="account-help">管理说明</button></div>').join('')+'</section><section class="it-panel it-import"><div class="it-import-head"><span class="it-thumb">'+icon('file-spreadsheet')+'</span><div><h2>Excel 批量创建员工</h2><small>.xlsx 模板 · 最多 500 人 / 5 MB</small></div></div><div class="it-upload">工号（文本） · 姓名 · 邮箱（选填）<br><small>只创建普通员工，不覆盖已有账号，不通过角色列授予权限。</small></div><div class="it-row" style="margin-top:16px">'+button('模板说明','template')+button('预览校验失败','import-error')+button('预览导入成功','import-success',true)+'</div><div class="it-import-result">'+(importMode==='error'?'<div class="it-notice it-warning">发现 2 处问题。本次未创建任何账号，请修正后重新导入。</div><table class="it-sample-table"><thead><tr><th>Excel 行号</th><th>字段</th><th>错误原因</th></tr></thead><tbody><tr><td>第 3 行</td><td>工号</td><td>00101 已存在</td></tr><tr><td>第 5 行</td><td>姓名</td><td>必填内容为空</td></tr></tbody></table>':importMode==='success'?'<div class="it-notice">示例结果：校验通过，成功创建 3 个普通员工账号。</div><p class="it-sub">正式实现将在此一次性交付账号凭据文件。临时密码分别交付，首次登录强制修改；丢失后只能重置。</p><small>本次预览没有创建真实账号，也不生成或下载密码。</small>':'<p class="it-sub">先校验整批名单；有错误则整批不创建，成功时整批创建。</p>')+'</div></section>';}
    root.addEventListener('change',event=>{if(event.target.id==='it-persona'){user=event.target.value;action=null;notify('已切换预览身份；仅用于设计评审，不是实际账号登录。');if(page==='detail'&&canRead(current()))render();else navPage(engineer()?'work':admin()?'manage':'mine');}});
    root.addEventListener('click',event=>{const el=event.target.closest('button');if(!el||el.disabled)return;
      if(el.dataset.nav){navPage(el.dataset.nav);return;}if(el.dataset.ticket){selected=Number(el.dataset.ticket);page='detail';action=null;render();return;}
      if(el.dataset.filter){filter=el.dataset.filter;pageIndex=0;render();return;}if(el.dataset.scope){scope=el.dataset.scope;pageIndex=0;render();return;}
      const key=el.dataset.action;if(!key)return;
      if(key==='new'){navPage('create');return;}if(key==='back'){navPage(engineer()?'work':admin()?'manage':'mine');return;}if(key==='prev'||key==='next'){pageIndex+=key==='next'?1:-1;render();return;}
      if(key==='account-help'){notify('正式版：单个新增可选择固定角色；重置后强制改密；停用工程师前先交接未结工单。本轮未执行账号操作。');return;}
      if(key==='template'){notify('模板字段：工号（文本、必填）、姓名（必填）、邮箱（选填）。本轮仅展示字段说明，不提供实际下载。');return;}
      if(key.startsWith('import-')){importMode=key==='import-error'?'error':'success';render();return;}
      if(key==='dismiss'){action=null;render();return;}
      const t=current();if(!actionsFor(t).some(a=>a[1]===key)){notify('当前身份或状态不允许此操作。');return;}
      if(key==='start'){t.state='PROCESSING';t.started=true;addHistory(t,'开始处理：待处理 → 处理中');notify('已开始处理。可直接追问或继续排查。');render();return;}
      action=key;render();content.querySelector('#it-action-form textarea, #it-action-form select, #it-action-form button')?.focus();
    });
    function fail(form,text){form.querySelector('.it-error').textContent=text;}
    const validText=(s,max=5000)=>s.trim().length>0&&Array.from(s.trim()).length<=max;
    root.addEventListener('submit',event=>{event.preventDefault();const form=event.target,fd=new FormData(form),v=key=>String(fd.get(key)||'').trim();
      if(form.id==='it-search'){query=v('query');typeFilter=v('type');priorityFilter=v('priority');ownerFilter=v('owner')||'ALL';pageIndex=0;render();return;}
      if(form.id==='it-create'){if(!validText(v('title'),100)||!validText(v('description')))return fail(form,'标题需为 1～100 字符，描述需为 1～5000 字符，不能只有空白。');const time=now();const t={id:Math.max(...data.map(t=>t.id))+1,title:v('title'),description:v('description'),type:v('type'),priority:'普通',applicant:user,owner:null,former:[],state:'OPEN',started:false,created:time,updated:time,replies:[],solutions:[],history:[{who:user,time,text:'创建工单'}]};data.push(t);selected=t.id;page='detail';notify('示例工单已创建，等待管理员分配。仅本次预览有效。');render();return;}
      const t=current();if(form.id==='it-reply'){if(!canReply(t))return fail(form,'当前不可回复。');if(!validText(v('text')))return fail(form,'回复需为 1～5000 字符，不能只有空白。');const time=now();t.replies.push({who:user,time,text:v('text')});t.updated=time;notify('回复已追加，工单状态未改变。');render();return;}
      if(form.id!=='it-action-form')return;
      if(!actionsFor(t).some(a=>a[1]===action))return fail(form,'状态或负责人已变化，请刷新后重新操作。');
      const reasonText=v('reason'),old=stateNames[t.state];
      if(['solve','return','adminclose','cancel'].includes(action)||(action==='assign'&&t.owner)){if(!validText(reasonText))return fail(form,'说明需为 1～5000 字符，不能只有空白。');}
      if(action==='assign'){const target=v('owner');if(!['E','F'].includes(target)||target===t.owner)return fail(form,'请选择另一位有效工程师。');const previous=t.owner;if(previous&&!t.former.includes(previous))t.former.push(previous);t.owner=target;t.state='OPEN';addHistory(t,(previous?'转派：'+people[previous].name+' → ':'分配给 ')+people[target].name+(previous?'；原因：'+reasonText:'')+'；状态：'+old+' → 待处理');}
      if(action==='solve'){t.state='RESOLVED';const time=addHistory(t,'提交第 '+(t.solutions.length+1)+' 轮解决结果：处理中 → 已解决，待确认');t.solutions.push({who:user,time,text:reasonText});}
      if(action==='return'){t.state='PROCESSING';addHistory(t,'反馈未解决：已解决，待确认 → 处理中；原因：'+reasonText);}
      if(action==='close'||action==='adminclose'){const method=action==='close'?'申请人确认':'管理员代关';t.state='CLOSED';const time=addHistory(t,method+'：已解决，待确认 → 已关闭'+(reasonText?'；理由：'+reasonText:''));t.closure={who:user,time,method,reason:reasonText};}
      if(action==='classify'){const prev=t.type+' / '+t.priority;t.type=v('type');t.priority=v('priority');if(prev!==t.type+' / '+t.priority)addHistory(t,'调整分类与优先级：'+prev+' → '+t.type+' / '+t.priority);}
      if(action==='cancel'){const category=v('category'),reference=v('reference').toUpperCase();let detail=reasonText;
        if(category==='重复工单'&&!data.some(other=>number(other)===reference&&other.id!==t.id&&other.state!=='CANCELLED'))return fail(form,'请输入另一张存在且未取消的保留工单完整编号。');
        if(category==='超出 IT 受理范围'){if(!v('contact'))return fail(form,'超范围取消需填写建议联系的部门或渠道。');detail+='；建议联系：'+v('contact');}
        if(category==='申请人停用后无需处理'&&!people[t.applicant].disabled)return fail(form,'仅适用于申请人已停用且经管理员核实无需处理的工单。');
        // 撤回意愿与事实由管理员核实，不用关键词推断用户真实意愿。
        t.state='CANCELLED';const time=addHistory(t,'取消：'+category+'；'+detail+(category==='重复工单'?'；保留 '+reference:''));t.cancel={who:user,time,category,reason:detail,reference:category==='重复工单'?reference:''};
      }
      action=null;notify('示例操作已完成，相关结果与历史已更新。');render();
    });
    render();
    const design={density:'舒适',tone:'青绿',radius:14};
    function applyDesign(){root.style.setProperty('--it-pad',design.density==='紧凑'?'16px':'22px');root.style.setProperty('--it-radius',design.radius+'px');root.style.setProperty('--it-accent',design.tone==='青绿'?'light-dark(#087c70,#72d9c7)':'light-dark(#345cb0,#a9c4ff)');root.style.setProperty('--it-tint',design.tone==='青绿'?'light-dark(#e8f5f1,#183c39)':'light-dark(#edf2fc,#243653)');}
    if(globalThis.Tweak){const tweak=new globalThis.Tweak({container:root,onChange:applyDesign});tweak.addSelect(design,'density',{label:'信息密度',options:['舒适','紧凑']});tweak.addSelect(design,'tone',{label:'强调色方向',options:['青绿','蓝色']});tweak.addSlider(design,'radius',{label:'圆角',min:6,max:18,unit:'px'});}
  })();
  </script>
</div>
